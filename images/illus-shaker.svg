<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="JetBrains Mono, monospace">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1d3042" stroke-width="1"/></pattern>
  </defs>
  <rect width="400" height="300" fill="#13202c"/><rect width="400" height="300" fill="url(#g)"/>
  <g fill="none" stroke="#cfe3f5" stroke-width="2" stroke-linejoin="round">
    <!-- cabinet -->
    <rect x="70" y="50" width="220" height="210" rx="8"/>
    <rect x="84" y="64" width="150" height="182" rx="4" stroke="#5fb3ff"/>
    <line x1="228" y1="140" x2="228" y2="170" stroke-width="4" stroke-linecap="round"/>
    <!-- control column -->
    <rect x="246" y="64" width="32" height="182" rx="4"/>
    <rect x="251" y="74" width="22" height="34" rx="2" fill="#0c151d" stroke="#ff8a3d"/>
    <circle cx="262" cy="126" r="6"/><circle cx="262" cy="146" r="6"/>
    <circle cx="262" cy="228" r="7" stroke="#ff8a3d"/>
    <!-- platform + flasks -->
    <rect x="96" y="196" width="126" height="10" rx="2"/>
    <line x1="110" y1="206" x2="110" y2="230"/><line x1="208" y1="206" x2="208" y2="230"/>
    <rect x="100" y="230" width="118" height="8" rx="2"/>
    <path d="M114 196 l8 -26 v-14 h12 v14 l8 26z"/>
    <path d="M152 196 l8 -26 v-14 h12 v14 l8 26z"/>
    <path d="M190 196 l6 -20 v-12 h10 v12 l6 20z"/>
    <path d="M118 188 h28 M156 188 h28 M193 189 h22" stroke="#5fb3ff"/>
    <!-- shelf -->
    <line x1="92" y1="120" x2="226" y2="120" stroke-dasharray="4 4" stroke="#5fb3ff"/>
  </g>
  <!-- orbital motion -->
  <g fill="none" stroke="#ff8a3d" stroke-width="2" stroke-linecap="round">
    <path d="M128 92 a32 12 0 1 1 64 0"/><path d="M188 86 l4 6 -7 2"/>
  </g>
  <text x="262" y="96" fill="#ff8a3d" font-size="9" text-anchor="middle">180</text>
  <text x="262" y="104" fill="#ff8a3d" font-size="5" text-anchor="middle">RPM</text>
  <!-- callouts -->
  <g fill="#cfe3f5" font-size="10">
    <line x1="278" y1="91" x2="312" y2="91" stroke="#cfe3f5" stroke-dasharray="2 3"/>
    <text x="316" y="88">custom</text><text x="316" y="100">freq / speed</text>
    <line x1="290" y1="160" x2="312" y2="160" stroke="#cfe3f5" stroke-dasharray="2 3"/>
    <path d="M322 146 q-7 10 0 16 q7 -6 0 -16z" fill="none" stroke="#5fb3ff" stroke-width="1.6"/>
    <text x="334" y="158">high</text><text x="316" y="176">humidity</text>
    <line x1="290" y1="226" x2="312" y2="226" stroke="#cfe3f5" stroke-dasharray="2 3"/>
    <text x="316" y="224">custom</text><text x="316" y="236">PCB</text>
  </g>
  <text x="70" y="36" fill="#cfe3f5" font-size="11">INCUBATOR SHAKER</text>
  <text x="388" y="290" fill="#5b7a95" font-size="9" text-anchor="end">ILLUSTRATION</text>
